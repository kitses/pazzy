{% extends "base.html" %}

{% block title %}{{ config.title }}: {{ page.title }}{% endblock title %}

{% block content %}
<div class="content">
  <header>
    <h1>{{ page.title }}</h1>
    <time datetime="{{ page.date | date(format="%Y-%m-%d") }}">{{ page.date | date(format="%Y-%m-%d") }}</time>
  </header>
  <hr>
  {{ page.content | safe }}
</div>
{% endblock content %}
